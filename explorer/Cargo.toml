[package]
name = "annoyed-tools"
version = "0.1.0"
edition = "2021"
default-run = "annoyed-tools"

[features]
default = ["gui"]
gui = ["dep:iced", "dep:rfd", "dep:image"]

[[bin]]
name = "annoyed-tools"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
iced = { version = "0.14", optional = true, default-features = false, features = ["tiny-skia", "x11", "wayland", "thread-pool", "image-without-codecs"] }
flate2 = "1"
sha2 = "0.10"
rfd = { version = "0.18", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
